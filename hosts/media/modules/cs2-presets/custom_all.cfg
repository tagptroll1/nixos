// Executed after server.cfg for all gamemodes. Managed by NixOS flake.
mp_warmuptime "30"
mp_warmup_pausetimer "0"
// custom_all.cfg runs *after* the engine started its initial 60s warmup, so
// just setting mp_warmuptime won't shorten it. End the current warmup first,
// then start a fresh one which now picks up the new 30s duration.
mp_warmup_end
mp_warmup_start
echo "custom_all.cfg (NixOS override) executed — mp_warmuptime=30, warmup restarted"
