// Executed after server.cfg for all gamemodes. Managed by NixOS flake.
mp_warmuptime "30"
mp_warmup_pausetimer "0"
// custom_all.cfg runs *after* the engine started its initial 60s warmup. Just
// setting mp_warmuptime doesn't shorten the current warmup, and CS2 dropped
// the `mp_warmup_start` command from CS:GO — so we use mp_restartgame which
// re-inits the round and triggers a fresh warmup honoring the new duration.
mp_restartgame 1
echo "custom_all.cfg (NixOS override) executed — mp_warmuptime=30, game restarted"
