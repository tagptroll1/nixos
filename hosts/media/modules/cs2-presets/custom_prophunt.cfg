// Prop Hunt overrides — exec'd by prophunt.cfg before the plugin loads and by
// prophunt_settings.cfg (re-applied after map start, so values here survive the
// reload). This is the correct place for your tweaks. Do NOT set
// game_type/game_mode/css_gamemode here (prophunt.cfg owns those).
//
// Gameplay knobs (hide time, decoy/swap/taunt limits, hiding team) live in the
// plugin config instead: addons/counterstrikesharp/configs/plugins/PropHunt/PropHunt.json
//
// Hider actions are bindable CONSOLE COMMANDS (our patched plugin, no menu).
// Binds are client-side — players add these to their own autoexec/console:
//   bind "f1" "css_phfreeze"   // freeze prop in place (toggle)
//   bind "f2" "css_phdecoy"    // drop a decoy prop
//   bind "f3" "css_phtaunt"    // play a taunt sound
//   bind "f4" "css_phswap"     // swap to a random prop model
// Fallback if a client build doesn't forward console commands to the server:
//   bind "f1" "say !phfreeze"  (and !phdecoy / !phtaunt / !phswap)

hostname "TV 2 Fun Bun Server — Prop Hunt"

// Roomy buy-free, friendly-fire-off pub feel
mp_friendlyfire     0
mp_solid_teammates  0
sv_alltalk          1
sv_deadtalk         1

echo "custom_prophunt.cfg (NixOS override) executed"
