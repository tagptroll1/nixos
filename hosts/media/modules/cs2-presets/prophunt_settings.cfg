// Prop Hunt ruleset — modelled on kus hns_settings.cfg (the proven hide-style
// base). The PropHunt plugin owns the actual gameplay (team assignment, turning
// hiders into props, the hide timer = PropHunt.json Hiding.Time, taunts/decoys
// and round-end when all hiders are dead). These cvars just set a sane CS round
// shell around it. Tune in custom_prophunt.cfg / PropHunt.json, not here.
exec gamemode_casual.cfg

sv_cheats 1

exec settings/alltalk_on.cfg
exec settings/map_voting.cfg

mp_freezetime 0
mp_warmuptime 0
mp_team_intro_time 0
mp_round_restart_delay 5
// Finite so a round always ends even if everyone hides successfully; the
// plugin ends it sooner when all hiders are found.
mp_roundtime 5
mp_roundtime_defuse 5
mp_ignore_round_win_conditions 0

bot_kick
mp_warmup_end

exec custom_prophunt.cfg

sv_cheats 0

echo "prophunt_settings.cfg executed"
