// Competitive overrides for the kus comp.cfg chain.
// kus execs this from comp_settings.cfg AFTER gamemode_competitive.cfg, and
// comp.cfg re-applies it via exec_after_map_start, so values here win and
// survive the map reload. This is the correct place for comp tweaks — do NOT
// set game_type/game_mode/css_gamemode here (comp.cfg owns those).
// NOTE: MatchZy manages the match (knife round, !ready). Warmup below is the
// fallback length; MatchZy's ready-up still gates when live play starts.

// Short warmup
mp_warmuptime                       15
mp_warmuptime_all_players_connected 5
mp_warmup_pausetimer                0

// MR12 ruleset
mp_maxrounds          24
mp_overtime_enable    1
mp_overtime_maxrounds 6
mp_overtime_startmoney 12500
mp_halftime           1
mp_halftime_duration  15
mp_freezetime         15
mp_startmoney         800
mp_maxmoney           16000
mp_friendlyfire       1
mp_solid_teammates    1
mp_forcecamera        1
mp_buytime            20
mp_buy_anywhere       0
mp_death_drop_gun     1
mp_death_drop_grenade 2
mp_death_drop_defuser 1
sv_deadtalk           1
sv_alltalk            1
sv_pausable           1
mp_pause_match_on_freezetime 1

echo "custom_comp.cfg (NixOS override) executed — mp_warmuptime=15, MR12"
