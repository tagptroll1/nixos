// Prop Hunt mode loader — modelled on the kus hns.cfg chain.
// Registers the mode with GameModeManager (css_gamemode "Prop Hunt", which
// MUST match the List entry Name in GameModeManager.json) and loads the
// exkludera PropHunt plugin, which is otherwise kept in plugins/disabled so it
// never runs in other modes. unload_plugins.cfg (our override) unloads
// "Prop Hunt" when switching away.
game_type 0
game_mode 0
sv_skirmish_id 0
// mapgroup mg_prophunt
css_gamemode "Prop Hunt"

exec unload_plugins.cfg

// Execute before and after to ensure hostname is changed and old one isn't picked up by mods
exec custom_prophunt.cfg

// Load the prophunt plugin (gated; lives in plugins/disabled)
css_plugins load "plugins/disabled/PropHunt/PropHunt.dll"

// CS2AnnouncementBroadcaster Mode Flag (reuse the hns flag)
CS2AB_flag_1 14

exec prophunt_settings.cfg

exec_after_map_start "exec prophunt_settings.cfg"

echo "prophunt.cfg executed"
